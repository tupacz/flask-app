<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar como admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Ingresar como admin</h1>
    <form method="post" action="{{ url_for('main.login') }}" class="login">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit" id="submit-button">Ingresar</button>
        <p class="nota">Este navegador te va a recordar como admin durante un año, o hasta que salgas del modo admin.</p>
    </form>
    {% if error %}
    <div class="mensaje error" role="alert">{{ error }}</div>
    {% endif %}
    <p><a href="{{ url_for('main.index') }}">Volver a la votación</a></p>
</body>
</html>
