<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entrar como admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-volver="{{ url_for('main.index') }}">
    <script src="{{ url_for('static', filename='telegram.js') }}"></script>

    <main class="pagina">
        <header class="encabezado">
            <h1>Entrar como admin</h1>
            <p class="sub">Si organizás la votación desde tu cuenta de Telegram, abrí la votación desde el bot y ya entrás sin contraseña.</p>
        </header>

        <form method="post" action="{{ url_for('main.login') }}">
            <input type="hidden" name="next" value="{{ next }}">
            <h2 class="titulo-seccion"><label for="password">Contraseña</label></h2>
            <div class="seccion">
                <input type="password" class="campo" id="password" name="password" autocomplete="current-password" required autofocus>
            </div>
            <p class="pie-seccion">Este navegador te va a recordar como admin durante un año, o hasta que salgas del modo admin.</p>
            {% if error %}
            <div class="mensaje error" role="alert">{{ error }}</div>
            {% endif %}
            <button type="submit" class="boton">Entrar</button>
        </form>

        <div class="seccion enlaces solo-navegador" style="margin-top: 24px">
            <a href="{{ url_for('main.index') }}">Volver a la votación</a>
        </div>
    </main>
</body>
</html>
