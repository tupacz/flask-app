<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Libros de la votación</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-volver="{{ url_for('main.index') }}">
    <script src="{{ url_for('static', filename='telegram.js') }}"></script>

    <main class="pagina">
        <header class="encabezado">
            <h1>Libros de la votación</h1>
            <p class="sub">Cambialos antes de publicar la votación con /votacion. Si los cambiás cuando ya hay votos, esos votos dejan de coincidir con la lista.</p>
        </header>

        <div id="book-container">
            {% for book in books %}
            <div class="seccion libro-editable">
                <input type="text" class="campo" name="title" placeholder="Título" aria-label="Título" value="{{ book.title }}" required>
                <input type="text" class="campo" name="author" placeholder="Autor" aria-label="Autor" value="{{ book.author }}">
                <textarea class="campo" name="description" placeholder="Descripción" aria-label="Descripción">{{ book.description }}</textarea>
                <button type="button" class="boton-texto peligro delete-button">Borrar libro</button>
            </div>
            {% endfor %}
        </div>

        <button type="button" id="add-book-button" class="boton secundario">Agregar libro</button>

        <div id="mensaje" class="mensaje" role="alert" hidden></div>
        <button type="button" id="submit-button" class="boton" hidden>Guardar libros</button>

        <h2 class="titulo-seccion">Organización</h2>
        <div class="seccion enlaces">
            <a href="{{ url_for('main.winner') }}">Ver el resultado</a>
            <a href="{{ url_for('main.votes') }}">Editar los votos</a>
            <a href="{{ url_for('main.logout') }}">Salir del modo admin</a>
        </div>
    </main>

    <template id="libro-nuevo">
        <div class="seccion libro-editable">
            <input type="text" class="campo" name="title" placeholder="Título" aria-label="Título" required>
            <input type="text" class="campo" name="author" placeholder="Autor" aria-label="Autor">
            <textarea class="campo" name="description" placeholder="Descripción" aria-label="Descripción"></textarea>
            <button type="button" class="boton-texto peligro delete-button">Borrar libro</button>
        </div>
    </template>

    <script>
    (function () {
        const { confirmar, vibrar, botonPrincipal } = window.App;
        const contenedor = document.getElementById('book-container');
        const mensaje = document.getElementById('mensaje');
        let guardando = false;

        function mostrarMensaje(texto, esError) {
            mensaje.textContent = texto;
            mensaje.classList.toggle('error', !!esError);
            mensaje.hidden = false;
        }

        function agregarLibro() {
            const bloque = document.getElementById('libro-nuevo').content.firstElementChild.cloneNode(true);
            contenedor.appendChild(bloque);
            bloque.querySelector('input[name="title"]').focus();
        }

        document.getElementById('add-book-button').addEventListener('click', agregarLibro);
        if (!contenedor.children.length) agregarLibro();

        contenedor.addEventListener('click', async (evento) => {
            const borrar = evento.target.closest('.delete-button');
            if (!borrar) return;
            const bloque = borrar.closest('.libro-editable');
            const titulo = bloque.querySelector('input[name="title"]').value.trim();
            if (titulo && !(await confirmar(`¿Borrás ${titulo} de la lista?`))) return;
            bloque.remove();
            vibrar('light');
        });

        async function guardar() {
            if (guardando) return;
            const libros = Array.from(contenedor.querySelectorAll('.libro-editable')).map(bloque => ({
                title: bloque.querySelector('input[name="title"]').value.trim(),
                author: bloque.querySelector('input[name="author"]').value.trim(),
                description: bloque.querySelector('textarea[name="description"]').value.trim(),
            }));
            if (libros.some(libro => !libro.title)) {
                mostrarMensaje('Hay un libro sin título. Completalo o borralo antes de guardar.', true);
                vibrar('error');
                return;
            }
            guardando = true;
            boton.cargando(true);
            try {
                const respuesta = await fetch('/submit-book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(libros),
                });
                const resultado = await respuesta.json();
                mostrarMensaje(resultado.message, !respuesta.ok);
                vibrar(respuesta.ok ? 'success' : 'error');
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('No se pudieron guardar los libros. Probá de nuevo.', true);
                vibrar('error');
            } finally {
                guardando = false;
                boton.cargando(false);
            }
        }

        const boton = botonPrincipal('Guardar libros', guardar, document.getElementById('submit-button'));
    })();
    </script>
</body>
</html>
