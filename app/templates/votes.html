<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Editar los votos</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-volver="{{ url_for('main.index') }}">
    <script src="{{ url_for('static', filename='telegram.js') }}"></script>

    <main class="pagina">
        <header class="encabezado">
            <h1>Editar los votos</h1>
            <p class="sub">Cada línea es un voto. Para empezar una votación nueva, borrá todo y guardá.</p>
        </header>

        <h2 class="titulo-seccion">Archivo de votos</h2>
        <div class="seccion">
            <textarea id="datos" class="campo codigo" aria-label="Archivo de votos" spellcheck="false" autocapitalize="off">{{ data }}</textarea>
        </div>
        <p class="pie-seccion">No borres la marca [tg:…] del nombre: es lo que impide que alguien vote dos veces.</p>

        <div id="mensaje" class="mensaje" role="alert" hidden></div>
        <button type="button" id="guardar" class="boton" hidden>Guardar cambios</button>

        <h2 class="titulo-seccion">Organización</h2>
        <div class="seccion enlaces">
            <a href="{{ url_for('main.winner') }}">Ver el resultado</a>
            <a href="{{ url_for('main.books_manager') }}">Cambiar los libros</a>
            <a href="{{ url_for('main.logout') }}">Salir del modo admin</a>
        </div>
    </main>

    <script>
    (function () {
        const { confirmar, vibrar, botonPrincipal } = window.App;
        const mensaje = document.getElementById('mensaje');
        let guardando = false;

        function mostrarMensaje(texto, esError) {
            mensaje.textContent = texto;
            mensaje.classList.toggle('error', !!esError);
            mensaje.hidden = false;
        }

        async function guardar() {
            if (guardando) return;
            const ok = await confirmar('¿Guardás los cambios? Se reemplaza todo el archivo de votos.');
            if (!ok) return;
            guardando = true;
            boton.cargando(true);
            try {
                const respuesta = await fetch('/submit-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(document.getElementById('datos').value),
                });
                const resultado = await respuesta.json();
                mostrarMensaje(resultado.message, !respuesta.ok);
                vibrar(respuesta.ok ? 'success' : 'error');
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('No se pudieron guardar los cambios. Probá de nuevo.', true);
                vibrar('error');
            } finally {
                guardando = false;
                boton.cargando(false);
            }
        }

        const boton = botonPrincipal('Guardar cambios', guardar, document.getElementById('guardar'));
    })();
    </script>
</body>
</html>
