<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganador de Condorcet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <p class="barra-admin">Modo admin · <a href="{{ url_for('main.winner') }}">Ver resultado</a> · <a href="{{ url_for('main.logout') }}">Salir del modo admin</a></p>
    <p>{{ data }}</p>
    <p>
        <textarea name="description" placeholder="Descripción" style="width: 80%;" required>{{ data }}</textarea>
    </p>
    <p>
        <button id="submit-button">Cambiar</button>
    </p>
    <div id="mensaje" class="mensaje" role="alert" hidden></div>


    <script>
        document.getElementById('submit-button').addEventListener('click', () => {
            const data = document.querySelector('textarea[name="description"]').value;
            const mensaje = document.getElementById('mensaje');

            fetch('/submit-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(async response => {
                const result = await response.json();
                mensaje.textContent = result.message;
                mensaje.classList.toggle('error', !response.ok);
                mensaje.hidden = false;
            })
            .catch((error) => {
                console.error('Error:', error);
                mensaje.textContent = 'No se pudieron guardar los cambios. Probá de nuevo.';
                mensaje.classList.add('error');
                mensaje.hidden = false;
            });
        });
    </script>
</body>
